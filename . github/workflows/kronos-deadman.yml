# KRONOS dead-man switch: alerts on Telegram if the desk stops pushing summary.txt for 40+ minutes.
name: kronos-deadman
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Check feed age
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          last=$(git log -1 --format=%ct -- summary.txt)
          now=$(date +%s)
          age=$(( (now - last) / 60 ))
          echo "summary.txt last pushed ${age} min ago"
          send() {
            if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
              echo "Telegram secrets not set; cannot alert"; exit 1
            fi
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=$1" > /dev/null
          }
          if [ "$age" -ge 40 ]; then
            since=$(( age - 40 ))
            if [ $(( since % 360 )) -lt 30 ] || [ "$MANUAL" = "true" ]; then
              send "KRONOS WATCHDOG (GitHub): desk down, no summary pushed for ${age} min. Check Railway."
            fi
          elif [ "$MANUAL" = "true" ]; then
            send "KRONOS WATCHDOG (GitHub) test: desk is healthy, last summary ${age} min ago."
          fi
